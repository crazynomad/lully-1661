<!-- La Pâtissière silhouette
     Stylised silhouette of the baroque "La Pâtissière" sub-mark
     (woman wearing a tiered cake-stand dress, with a tray on the left and
     a paddle on the right). Hand-drawn from raw-requirements/logo-sub-patissiere.jpeg.
     Replace with the canonical InDesign-source SVG when client supplies it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80">
  <g fill="#8E8783">
    <!-- crown / hair tuft -->
    <path d="M30 2 q1 -2 2 0 q.4 1.5 -.4 2.4 q.6 .8 1.4 .4 q-.5 1.2 -1.5 1.2 q-1 0 -1.5 -1.2 q.8 .4 1.4 -.4 q-.8 -.9 -.4 -2.4 z"/>
    <!-- head + neck -->
    <ellipse cx="32" cy="9" rx="2.6" ry="3.2"/>
    <rect x="31" y="11.5" width="2" height="1.5"/>
    <!-- shoulders / bodice -->
    <path d="M27 14 q-2 4 -1 8 q6 -1.4 12 0 q1 -4 -1 -8 q-2 -1 -5 -1 q-3 0 -5 1 z"/>
    <!-- arms with tray (left) and paddle (right) -->
    <path d="M27 16 q-5 -.5 -9 4 l1 1 q4 -3.5 8 -3 z"/>
    <rect x="9" y="19" width="11" height="2.4" rx=".4"/>
    <path d="M37 16 q5 -.5 9 4 l-1 1 q-4 -3.5 -8 -3 z"/>
    <rect x="44" y="14" width="2" height="14" rx=".5"/>
    <ellipse cx="45" cy="13" rx="3.5" ry="2"/>
    <!-- tier 1 (widest at top of cake-stand) -->
    <path d="M22 22 h20 l2 6 h-24 z"/>
    <!-- tier 2 -->
    <path d="M21 28 h22 l2 8 h-26 z"/>
    <!-- tier 3 -->
    <path d="M19 36 h26 l2 10 h-30 z"/>
    <!-- tier 4 (widest base) -->
    <path d="M17 46 h30 l2 12 h-34 z"/>
    <!-- pedestal foot -->
    <path d="M22 58 h20 l-1 4 h-18 z"/>
    <!-- two tiny feet poking out -->
    <rect x="26" y="62" width="3" height="2"/>
    <rect x="35" y="62" width="3" height="2"/>
  </g>
</svg>
