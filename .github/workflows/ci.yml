name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger from the Actions tab. Useful for verifying the
  # workflow itself runs in isolation, and for ad-hoc audit re-runs
  # without needing a commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Audit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the build on any moderate-or-higher vulnerability in
      # production dependencies. Catches things like the 2026-05 next /
      # next-intl / postcss disclosures before they land on main.
      # --prod skips devDeps (vitest/playwright noise), --audit-level
      # below "moderate" would flag normal "low" CVEs that aren't worth
      # blocking on.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Build runs without Keystatic Cloud secrets — config.ts falls back
          # to local-filesystem mode when these aren't set.
          NEXT_PUBLIC_SITE_URL: https://lully1661.com
